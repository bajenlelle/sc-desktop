<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Your Scoutable sign-in link</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" width="540" cellpadding="0" cellspacing="0" style="max-width:540px;width:100%;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#000408;padding:24px 40px 26px 40px;text-align:center;">
              <img src="https://app.scoutable.se/email/logo-mark.png" width="40" height="36" alt="" style="display:block;width:40px;height:36px;margin:0 auto 10px auto;border:0;outline:none;text-decoration:none;">
              <span style="font-family:'Barlow Condensed',Impact,'Arial Narrow',Arial,sans-serif;font-size:20px;font-weight:700;color:#ffffff;letter-spacing:3px;text-transform:uppercase;">SCOUTABLE</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:#ffffff;padding:40px 40px 36px 40px;">
              <h1 style="margin:0 0 12px 0;font-size:20px;font-weight:700;color:#111827;letter-spacing:-0.3px;">Sign in to Scoutable</h1>
              <p style="margin:0 0 32px 0;font-size:14px;line-height:1.65;color:#6b7280;">
                Use the button below to sign in — the link works once and expires shortly.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                <tr>
                  <td style="border-radius:6px;background-color:#0096b1;">
                    <a href="{{ .ConfirmationURL }}" style="display:block;padding:14px 36px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:0.2px;">Sign in</a>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0 0;font-size:12px;line-height:1.6;color:#9ca3af;">
                If the button doesn't work, copy this link into your browser:<br>
                <a href="{{ .ConfirmationURL }}" style="color:#0096b1;word-break:break-all;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f9fafb;padding:20px 40px;border-top:1px solid #f3f4f6;text-align:center;">
              <p style="margin:0;font-size:11px;line-height:1.5;color:#9ca3af;">Didn't request this? Ignore this email — nobody can sign in without it.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
