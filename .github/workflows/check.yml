name: check
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, staging, main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Match the npm version used to generate package-lock.json (see release.yml).
      - run: npm install -g npm@11

      - run: npm ci

      - name: Type-check desktop
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11

      - run: npm ci

      - name: Type-check web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11

      - run: npm ci

      - name: Type-check mobile
        working-directory: apps/mobile
        run: npm run typecheck

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11

      - run: npm ci

      - name: Type-check shared
        working-directory: packages/shared
        run: npm run typecheck

      - name: Test shared
        working-directory: packages/shared
        run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build validates that frontendDist and the ffmpeg sidecar exist,
      # even for a check-only compile — stub both.
      - name: Stub Tauri build inputs
        run: |
          mkdir -p apps/desktop/dist
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --no-deps -- -D warnings
