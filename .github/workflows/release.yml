name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin npm to match the version used to generate package-lock.json.
      # npm 10 (bundled with Node 22) resolves some optional Expo peer deps
      # differently than npm 11 and rejects the current lockfile.
      - run: npm install -g npm@11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Cache arm64 FFmpeg binary
        if: matrix.platform == 'macos-14'
        id: cache-ffmpeg-arm64
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          key: ffmpeg-arm64-static-7.1.1-x264-2

      - name: Build arm64 FFmpeg (static)
        if: matrix.platform == 'macos-14' && steps.cache-ffmpeg-arm64.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: |
          mkdir -p src-tauri/binaries
          brew install nasm

          # Build x264 from source as a static-only lib.
          # Homebrew's x264 package ships only a .dylib; using it would create
          # a dynamic dep on /opt/homebrew which end users don't have.
          curl -sL "https://code.videolan.org/videolan/x264/-/archive/stable/x264-stable.tar.bz2" | tar -xj
          pushd x264-stable
          ./configure \
            --prefix="$PWD/out" \
            --enable-static \
            --disable-shared \
            --disable-opencl \
            --enable-strip
          make -j"$(sysctl -n hw.logicalcpu)"
          make install
          X264_OUT="$PWD/out"
          popd

          # PKG_CONFIG_LIBDIR replaces (rather than prepends to) the default
          # search path, eliminating any interference from Homebrew or system paths.
          export PKG_CONFIG_LIBDIR="${X264_OUT}/lib/pkgconfig"
          unset PKG_CONFIG_PATH

          pkg-config --modversion x264

          FFMPEG_VERSION=7.1.1
          curl -sL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.gz" | tar -xz
          cd "ffmpeg-${FFMPEG_VERSION}"
          ./configure \
            --prefix="$PWD/out" \
            --bindir="$PWD/out" \
            --arch=aarch64 \
            --target-os=darwin \
            --enable-gpl \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-libxcb \
            --disable-xlib \
            --enable-hardcoded-tables \
            --enable-libx264 \
            --pkg-config-flags="--static" \
            --extra-cflags="-I${X264_OUT}/include" \
            --extra-ldflags="-L${X264_OUT}/lib" \
            --cc=clang || { tail -80 ffbuild/config.log; exit 1; }
          grep -q "^CONFIG_LIBX264=yes" ffbuild/config.mak \
            || { echo "ERROR: CONFIG_LIBX264 not yes"; tail -120 ffbuild/config.log; exit 1; }
          make -j"$(sysctl -n hw.logicalcpu)"
          cp ffmpeg ../src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cd ..
          rm -rf "ffmpeg-${FFMPEG_VERSION}" x264-stable

      - name: Download macOS FFmpeg binaries
        if: matrix.platform == 'macos-14'
        working-directory: apps/desktop
        run: |
          mkdir -p src-tauri/binaries
          # x86_64 — static build from evermeet.cx
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg_x64.zip
          unzip -o ffmpeg_x64.zip ffmpeg
          mv ffmpeg src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          rm ffmpeg_x64.zip
          lipo -create -output src-tauri/binaries/ffmpeg-universal-apple-darwin \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          # Verify no Homebrew dylib deps crept in
          echo "=== arm64 dylib deps ==="
          otool -L src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          BAD=$(otool -L src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            | tail -n +2 | awk '{print $1}' \
            | grep -Ev '^/usr/lib|^/System|^@' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: non-system dylib deps in arm64 ffmpeg: $BAD"
            exit 1
          fi

      - name: Download Windows FFmpeg
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Import Apple certificate
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ matrix.platform == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-14' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Leonard Halling (3DJ5YZKR49)"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_ENV: production
          SCOUTABLE_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Sign macOS updater bundle
        if: matrix.platform == 'macos-14'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAR=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -1)
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TAR"

      - name: Create and sign Windows updater bundle
        if: matrix.platform == 'windows-latest'
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exeDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $exe = Get-ChildItem $exeDir -Filter "*.exe" | Select-Object -First 1
          $zipPath = Join-Path $exeDir ($exe.BaseName + ".nsis.zip")
          Compress-Archive -Path $exe.FullName -DestinationPath $zipPath
          npx tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" $zipPath

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scoutable-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/**/bundle/
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release in scoutable-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          shopt -s globstar nullglob
          VERSION=${{ steps.version.outputs.version }}
          TAG_NOTES=$(git tag -l --format='%(contents)' "v${VERSION}")
          NOTES="${TAG_NOTES:-See the assets below to download for macOS or Windows.}"
          gh release create "v${VERSION}" \
            --repo bajenlelle/scoutable-releases \
            --title "Scoutable v${VERSION}" \
            --notes "${NOTES}" \
            artifacts/**/*.dmg \
            artifacts/**/*.msi \
            artifacts/**/*.exe \
            artifacts/**/*.tar.gz \
            artifacts/**/*.tar.gz.sig \
            artifacts/**/*.zip \
            artifacts/**/*.zip.sig

  update-landing:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bajenlelle/sc-landing
          token: ${{ secrets.RELEASES_PAT }}

      - name: Update download URLs
        run: |
          VERSION=${{ needs.publish.outputs.version }}
          sed -i -E "s|releases/download/v[0-9.]+/Scoutable_[0-9.]+_universal\.dmg|releases/download/v${VERSION}/Scoutable_${VERSION}_universal.dmg|g" \
            components/Hero.tsx components/Download.tsx
          sed -i -E "s|releases/download/v[0-9.]+/Scoutable_[0-9.]+_x64-setup\.exe|releases/download/v${VERSION}/Scoutable_${VERSION}_x64-setup.exe|g" \
            components/Hero.tsx components/Download.tsx

      - name: Commit and push
        run: |
          VERSION=${{ needs.publish.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/Hero.tsx components/Download.tsx
          git diff --staged --quiet || git commit -m "chore: update download URL to v${VERSION}"
          git push
