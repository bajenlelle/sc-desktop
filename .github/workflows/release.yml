name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Cache arm64 FFmpeg binary
        if: matrix.platform == 'macos-14'
        id: cache-ffmpeg-arm64
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          key: ffmpeg-arm64-static-7.1.1

      - name: Build arm64 FFmpeg (static)
        if: matrix.platform == 'macos-14' && steps.cache-ffmpeg-arm64.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/binaries
          # Install only the codec libs we need
          brew install nasm pkg-config x264 freetype
          FFMPEG_VERSION=7.1.1
          curl -sL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.gz" | tar -xz
          cd "ffmpeg-${FFMPEG_VERSION}"
          # Put only .a files on the search path so ld64 doesn't pick up .dylib
          mkdir -p ../static-libs
          for lib in x264 freetype; do
            find "$(brew --prefix $lib)/lib" -name "*.a" -exec ln -sf {} ../static-libs/ \;
          done
          PKG_CONFIG_PATH="$(brew --prefix x264)/lib/pkgconfig:$(brew --prefix freetype)/lib/pkgconfig" \
          ./configure \
            --prefix="$PWD/out" \
            --bindir="$PWD/out" \
            --enable-gpl \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-ffplay \
            --disable-ffprobe \
            --enable-hardcoded-tables \
            --enable-libfreetype \
            --enable-libx264 \
            --extra-ldflags="-L$PWD/../static-libs" \
            --cc=clang
          make -j"$(sysctl -n hw.logicalcpu)"
          cp out/ffmpeg ../src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cd ..
          rm -rf "ffmpeg-${FFMPEG_VERSION}" static-libs

      - name: Download macOS FFmpeg binaries
        if: matrix.platform == 'macos-14'
        run: |
          mkdir -p src-tauri/binaries
          # x86_64 — static build from evermeet.cx
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg_x64.zip
          unzip -o ffmpeg_x64.zip ffmpeg
          mv ffmpeg src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          rm ffmpeg_x64.zip
          lipo -create -output src-tauri/binaries/ffmpeg-universal-apple-darwin \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          # Verify no Homebrew dylib deps crept in
          echo "=== arm64 dylib deps ===" && otool -L src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      - name: Download Windows FFmpeg
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Import Apple certificate
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ matrix.platform == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-14' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Leonard Halling (3DJ5YZKR49)"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        with:
          args: ${{ matrix.args }}

      - name: Sign macOS updater bundle
        if: matrix.platform == 'macos-14'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAR=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -1)
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TAR"

      - name: Create and sign Windows updater bundle
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exeDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $exe = Get-ChildItem $exeDir -Filter "*.exe" | Select-Object -First 1
          $zipPath = Join-Path $exeDir ($exe.BaseName + ".nsis.zip")
          Compress-Archive -Path $exe.FullName -DestinationPath $zipPath
          npx tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" $zipPath

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scoutable-${{ matrix.platform }}
          path: src-tauri/target/**/bundle/
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release in scoutable-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          shopt -s globstar nullglob
          VERSION=${{ steps.version.outputs.version }}
          gh release create "v${VERSION}" \
            --repo bajenlelle/scoutable-releases \
            --title "Scoutable v${VERSION}" \
            --notes "See the assets below to download for macOS or Windows." \
            artifacts/**/*.dmg \
            artifacts/**/*.msi \
            artifacts/**/*.exe \
            artifacts/**/*.tar.gz \
            artifacts/**/*.tar.gz.sig \
            artifacts/**/*.zip \
            artifacts/**/*.zip.sig

  update-landing:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bajenlelle/sc-landing
          token: ${{ secrets.RELEASES_PAT }}

      - name: Update download URLs
        run: |
          VERSION=${{ needs.publish.outputs.version }}
          sed -i -E "s|releases/download/v[0-9.]+/Scoutable_[0-9.]+_universal\.dmg|releases/download/v${VERSION}/Scoutable_${VERSION}_universal.dmg|g" \
            components/Hero.tsx components/Download.tsx
          sed -i -E "s|releases/download/v[0-9.]+/Scoutable_[0-9.]+_x64-setup\.exe|releases/download/v${VERSION}/Scoutable_${VERSION}_x64-setup.exe|g" \
            components/Hero.tsx components/Download.tsx

      - name: Commit and push
        run: |
          VERSION=${{ needs.publish.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/Hero.tsx components/Download.tsx
          git diff --staged --quiet || git commit -m "chore: update download URL to v${VERSION}"
          git push
