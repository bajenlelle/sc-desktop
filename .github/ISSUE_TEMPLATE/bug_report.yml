name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - desktop
        - web
        - mobile
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Desktop → Settings → About. Mobile → bottom of Profile. Web → leave blank.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See error
