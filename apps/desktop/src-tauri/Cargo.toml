[package]
name = "scoutable"
version = "1.0.1"
description = "Scoutable desktop"
authors = ["Scoutable"]
edition = "2021"

[lib]
name = "scoutable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: the transparent window behind the vibrancy sidebar is
# compiled behind this feature; the CLI enables it from tauri.macos.conf.json,
# naming it here keeps plain `cargo clippy`/`cargo test` on the same code.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `deep-link` feature: forwards a scoutable:// URL from a second launch to the
# running instance's deep-link plugin — without it every auth link on Windows
# starts a new app that drops the URL.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-sentry = "0.6"
sentry = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
http-range = "0.1"
ab_glyph = "0.2"
image = "0.25"
imageproc = "0.25"
machine-uid = "0.5"
sha2 = "0.10"
base64 = "0.22"
hostname = "0.4"
